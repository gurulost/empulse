name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        services:
            postgres:
                image: postgres:16.15-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815
                env:
                    POSTGRES_DB: empulse_test
                    POSTGRES_USER: empulse
                    POSTGRES_PASSWORD: empulse_test_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U empulse -d empulse_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup PHP
              uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
              with:
                  php-version: '8.5.12'
                  extensions: bcmath, ctype, dom, fileinfo, mbstring, pdo_pgsql
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  {
                    echo "APP_ENV=testing"
                    echo "APP_DEBUG=true"
                    echo "APP_URL=http://127.0.0.1:8080"
                    echo "APP_RELEASE_SHA=$GITHUB_SHA"
                    echo "DEPLOYMENT_ENVIRONMENT_ID=ci-$GITHUB_RUN_ID"
                    echo "DB_CONNECTION=pgsql"
                    echo "DB_HOST=127.0.0.1"
                    echo "DB_PORT=5432"
                    echo "DB_DATABASE=empulse_test"
                    echo "DB_USERNAME=empulse"
                    echo "DB_PASSWORD=empulse_test_password"
                    echo "CACHE_STORE=database"
                    echo "QUEUE_CONNECTION=database"
                    echo "SESSION_DRIVER=database"
                    echo "MAIL_MAILER=array"
                  } >> .env

            - name: Install integrity-pinned isolated build npm
              run: |
                  node scripts/check-node-runtime.mjs
                  node scripts/install-build-npm.mjs "$RUNNER_TEMP/empulse-build-npm"
                  echo "$RUNNER_TEMP/empulse-build-npm/bin" >> "$GITHUB_PATH"

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Install Node dependencies
              run: npm ci --ignore-scripts

            - name: Validate and audit dependencies
              run: |
                  composer validate --strict
                  php scripts/check-php-runtime.php
                  composer audit --no-interaction
                  npm audit --audit-level=high
                  php artisan readiness:checklist

            - name: Generate key and migrate
              run: |
                  php artisan key:generate
                  php artisan migrate --force
                  php artisan db:seed --force

            - name: Verify production cache artifacts
              run: |
                  php artisan config:cache
                  php artisan route:cache
                  php artisan view:cache
                  php artisan config:clear
                  php artisan route:clear
                  php artisan view:clear

            - name: Run backend tests
              run: composer test

            - name: Run PHP formatting and static-analysis gates
              run: |
                  vendor/bin/pint --test
                  composer analyse

            - name: Run frontend lint and component tests
              env:
                  LARAVEL_BYPASS_ENV_CHECK: 1
              run: |
                  npm run lint
                  npm run test:unit

            - name: Build frontend assets
              run: npm run build

            - name: Install Playwright browser
              timeout-minutes: 10
              run: npx playwright install --with-deps chrome

            - name: Prepare browser journey database
              run: php artisan migrate:fresh --seed --force

            - name: Build the actual browser-journey image
              run: docker build --pull -t empulse:journey .

            - name: Start containerized web and worker processes
              run: |
                  php -r '
                    require "vendor/autoload.php";
                    $output = "";
                    foreach (Dotenv\Dotenv::parse(file_get_contents(".env")) as $key => $value) {
                      if (str_contains((string) $value, "\n")) throw new RuntimeException("Multiline CI environment value.");
                      $output .= $key."=".$value."\n";
                    }
                    $path = getenv("RUNNER_TEMP")."/empulse-journey.env";
                    file_put_contents($path, $output);
                    chmod($path, 0600);
                  '
                  docker run -d --name empulse-ci-worker --add-host host.docker.internal:host-gateway \
                    --env-file "$RUNNER_TEMP/empulse-journey.env" -e DB_HOST=host.docker.internal \
                    empulse:journey php artisan queue:work --tries=1 --sleep=1 --timeout=120
                  # Synthetic-only test configuration cannot satisfy the default
                  # production guard. Override the command, not the guard; the
                  # container job separately qualifies the real guarded startup.
                  docker run -d --name empulse-ci-web --add-host host.docker.internal:host-gateway \
                    --env-file "$RUNNER_TEMP/empulse-journey.env" -e DB_HOST=host.docker.internal \
                    -p 127.0.0.1:8080:8080 empulse:journey \
                    sh -c 'php-fpm -F & exec nginx -e stderr -g "daemon off;"'
                  for attempt in {1..30}; do
                    curl --fail --silent http://127.0.0.1:8080/api/readyz && break
                    sleep 1
                  done
                  curl --fail http://127.0.0.1:8080/api/readyz

            - name: Run Playwright role and failure journeys
              env:
                  PLAYWRIGHT_BASE_URL: http://127.0.0.1:8080
                  PLAYWRIGHT_CHANNEL: chrome
              run: npm run test:e2e

            - name: Capture failed container process logs
              if: failure()
              run: |
                  docker logs empulse-ci-web > storage/logs/ci-container-web.log 2>&1 || true
                  docker logs empulse-ci-worker > storage/logs/ci-container-worker.log 2>&1 || true

            - name: Upload failure evidence
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: ci-failure-evidence
                  path: |
                      storage/logs/*.log
                      test-results/
                      playwright-report/

            - name: Stop disposable browser-journey containers
              if: always()
              run: docker rm -fv empulse-ci-web empulse-ci-worker 2>/dev/null || true

    secret-scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
            - name: Scan proposed changes for secrets
              uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITLEAKS_VERSION: 8.24.3
            - name: Verify full-history secret policy
              run: bash .github/verify-gitleaks-history-policy.sh /tmp/gitleaks-8.24.3/gitleaks

    container-scan:
        runs-on: ubuntu-latest
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - name: Install checksum-pinned Trivy
              run: |
                  curl --fail --location --silent --show-error \
                    https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz \
                    -o "$RUNNER_TEMP/trivy.tar.gz"
                  echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
                  tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
            - name: Build clean runtime and frontend toolchain images
              run: |
                  docker build --pull --no-cache --target frontend -t empulse-frontend:audit .
                  docker build --pull --no-cache -t empulse:audit .
                  # Export the vendor stage freshly built by the preceding
                  # no-cache runtime build; no external build cache is used.
                  docker build --target vendor -t empulse-vendor:audit .
                  docker build --pull --no-cache -f docker/postgres/Dockerfile -t empulse-postgres:audit .
            - name: Smoke-test the actual production PHP-FPM and nginx image
              run: |
                  docker run --rm --entrypoint php empulse:audit scripts/check-php-runtime.php
                  docker run --rm --entrypoint php empulse:audit -r '
                    require "vendor/autoload.php";
                    foreach (["bcmath", "curl", "dom", "fileinfo", "gd", "intl", "mbstring", "openssl", "pcntl", "pdo_pgsql", "zip"] as $extension) {
                      if (!extension_loaded($extension)) throw new RuntimeException("Missing extension: ".$extension);
                    }
                    echo "Production autoloader and required extensions passed.\n";
                  '
                  docker run --rm --entrypoint php-fpm empulse:audit -t
                  docker run --rm --entrypoint nginx empulse:audit -e stderr -t
            - name: Qualify guarded rootless startup, routing, privacy and process lifecycle
              run: bash .github/tests/container-runtime.sh
            - name: Scan actual built images and export SBOMs
              run: |
                  status=0
                  for image in empulse empulse-frontend empulse-vendor empulse-postgres; do
                    "$RUNNER_TEMP/trivy" image --scanners vuln --format json \
                      --severity HIGH,CRITICAL --exit-code 1 \
                      --output "$image-vulnerabilities.json" "$image:audit" || status=$?
                    "$RUNNER_TEMP/trivy" image --format cyclonedx \
                      --output "$image-sbom.cdx.json" "$image:audit" || status=$?
                  done
                  exit "$status"
            - name: Retain container evidence even when the security gate fails
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: container-security-evidence
                  path: |
                      *-vulnerabilities.json
                      *-sbom.cdx.json
                      ${{ runner.temp }}/empulse-runtime-*.log
