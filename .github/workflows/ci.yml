name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        services:
            postgres:
                image: postgres:16.15-alpine@sha256:deb28ee471183cb0c303113dac9b2433c51eeeeb678def7af9a9ec5820367815
                env:
                    POSTGRES_DB: empulse_test
                    POSTGRES_USER: empulse
                    POSTGRES_PASSWORD: empulse_test_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U empulse -d empulse_test"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Setup PHP
              uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
              with:
                  php-version: '8.2.35'
                  extensions: bcmath, ctype, dom, fileinfo, mbstring, pdo_pgsql
                  coverage: none

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version-file: .node-version
                  cache: npm

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  {
                    echo "APP_ENV=testing"
                    echo "APP_DEBUG=true"
                    echo "APP_URL=http://127.0.0.1:8000"
                    echo "DB_CONNECTION=pgsql"
                    echo "DB_HOST=127.0.0.1"
                    echo "DB_PORT=5432"
                    echo "DB_DATABASE=empulse_test"
                    echo "DB_USERNAME=empulse"
                    echo "DB_PASSWORD=empulse_test_password"
                    echo "CACHE_STORE=file"
                    echo "QUEUE_CONNECTION=database"
                    echo "SESSION_DRIVER=file"
                    echo "MAIL_MAILER=array"
                  } >> .env

            - name: Install integrity-pinned isolated build npm
              run: |
                  node scripts/check-node-runtime.mjs
                  node scripts/install-build-npm.mjs "$RUNNER_TEMP/empulse-build-npm"
                  echo "$RUNNER_TEMP/empulse-build-npm/bin" >> "$GITHUB_PATH"

            - name: Install PHP dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Install Node dependencies
              run: npm ci --ignore-scripts

            - name: Validate and audit dependencies
              run: |
                  composer validate --strict
                  php scripts/check-php-runtime.php
                  composer audit --no-interaction
                  npm audit --audit-level=high
                  php artisan readiness:checklist

            - name: Generate key and migrate
              run: |
                  php artisan key:generate
                  php artisan migrate --force
                  php artisan db:seed --force

            - name: Verify production cache artifacts
              run: |
                  php artisan config:cache
                  php artisan route:cache
                  php artisan view:cache
                  php artisan config:clear
                  php artisan route:clear
                  php artisan view:clear

            - name: Run backend tests
              run: composer test

            - name: Run PHP formatting and static-analysis gates
              run: |
                  vendor/bin/pint --test
                  composer analyse

            - name: Run frontend lint and component tests
              env:
                  LARAVEL_BYPASS_ENV_CHECK: 1
              run: |
                  npm run lint
                  npm run test:unit

            - name: Build frontend assets
              run: npm run build

            - name: Install Playwright browser
              timeout-minutes: 5
              run: npx playwright install --with-deps chrome

            - name: Prepare browser journey database
              run: php artisan migrate:fresh --seed --force

            - name: Start real web and worker processes
              run: |
                  php artisan queue:work --tries=1 --sleep=1 --timeout=120 > storage/logs/ci-worker.log 2>&1 &
                  php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/ci-server.log 2>&1 &
                  for attempt in {1..30}; do
                    curl --fail --silent http://127.0.0.1:8000/api/readyz && break
                    sleep 1
                  done
                  curl --fail http://127.0.0.1:8000/api/readyz

            - name: Run Playwright role and failure journeys
              env:
                  PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
                  PLAYWRIGHT_CHANNEL: chrome
              run: npm run test:e2e

            - name: Upload failure evidence
              if: failure()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: ci-failure-evidence
                  path: |
                      storage/logs/*.log
                      test-results/
                      playwright-report/

    secret-scan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
            - name: Scan proposed changes for secrets
              uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GITLEAKS_VERSION: 8.24.3
            - name: Verify full-history secret policy
              run: bash .github/verify-gitleaks-history-policy.sh /tmp/gitleaks-8.24.3/gitleaks

    container-scan:
        runs-on: ubuntu-latest
        timeout-minutes: 40
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            - name: Install checksum-pinned Trivy
              run: |
                  curl --fail --location --silent --show-error \
                    https://github.com/aquasecurity/trivy/releases/download/v0.76.1/trivy_0.76.1_Linux-64bit.tar.gz \
                    -o "$RUNNER_TEMP/trivy.tar.gz"
                  echo "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
                  tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
            - name: Build clean runtime and frontend toolchain images
              run: |
                  docker build --pull --no-cache --target frontend -t empulse-frontend:audit .
                  docker build --pull --no-cache -t empulse:audit .
            - name: Smoke-test the actual production PHP and Apache image
              run: |
                  docker run --rm --entrypoint php empulse:audit scripts/check-php-runtime.php
                  docker run --rm --entrypoint php empulse:audit -r '
                    require "vendor/autoload.php";
                    foreach (["bcmath", "curl", "dom", "fileinfo", "gd", "intl", "mbstring", "openssl", "pcntl", "pdo_pgsql", "zip"] as $extension) {
                      if (!extension_loaded($extension)) throw new RuntimeException("Missing extension: ".$extension);
                    }
                    echo "Production autoloader and required extensions passed.\n";
                  '
                  docker run --rm --entrypoint apache2ctl empulse:audit -t
            - name: Scan actual built images and export SBOMs
              run: |
                  status=0
                  for image in empulse empulse-frontend; do
                    "$RUNNER_TEMP/trivy" image --scanners vuln --format json \
                      --severity HIGH,CRITICAL --exit-code 1 \
                      --output "$image-vulnerabilities.json" "$image:audit" || status=$?
                    "$RUNNER_TEMP/trivy" image --format cyclonedx \
                      --output "$image-sbom.cdx.json" "$image:audit" || status=$?
                  done
                  exit "$status"
            - name: Retain container evidence even when the security gate fails
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: container-security-evidence
                  path: |
                      *-vulnerabilities.json
                      *-sbom.cdx.json
