services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - uploads:/var/www/html/public/upload
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    command: >
      sh -lc "php artisan app:production-check &&
      php artisan queue:work --tries=3 --backoff=10 --sleep=1
      --timeout=120 --max-time=3600"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.production}
    command: sh -lc "php artisan app:production-check && php artisan schedule:work"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  uploads:
