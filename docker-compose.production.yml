services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: empulse-postgres:local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    stop_grace_period: 35s
    env_file: ${ENV_FILE:-.env.production}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - uploads:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    user: www-data
    restart: unless-stopped
    stop_grace_period: 135s
    env_file: ${ENV_FILE:-.env.production}
    command: >
      sh -lc "php scripts/check-php-runtime.php && php artisan app:production-check &&
      php artisan queue:work --tries=3 --backoff=10 --sleep=1
      --timeout=120 --max-time=3600"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build: .
    user: www-data
    restart: unless-stopped
    stop_grace_period: 35s
    env_file: ${ENV_FILE:-.env.production}
    command: sh -lc "php scripts/check-php-runtime.php && php artisan app:production-check && php artisan schedule:work"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  uploads:
