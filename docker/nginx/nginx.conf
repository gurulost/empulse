worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Assignment/invitation URLs contain bearer material: never log URI,
    # query strings, cookies, Referer, or respondent network identifiers.
    log_format empulse '$request_method $status $body_bytes_sent $request_time $upstream_response_time';
    access_log /dev/stdout empulse;
    server_tokens off;
    sendfile on;
    client_max_body_size 24m;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;
        # nginx's request-error format cannot redact URI tokens. Application
        # errors are redacted by Laravel; access status/timings remain above.
        # Startup/process errors still go to the global stderr error log.
        error_log /dev/null;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Execute only the fixed Laravel front controller, never uploaded PHP.
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            fastcgi_param HTTP_PROXY "";
            fastcgi_hide_header X-Powered-By;
            fastcgi_pass 127.0.0.1:9000;
        }

        location ~* \.php(?:/|$) {
            return 404;
        }

        location ~ /\.(?!well-known/) {
            deny all;
        }

        location /storage/ {
            try_files $uri =404;
        }
    }
}
